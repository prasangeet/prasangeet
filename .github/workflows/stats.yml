name: Update GitHub Profile Metrics

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stats.yml"

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          user: prasangeet
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "Update GitHub profile metrics"
          filename: profile/github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: regular
          config_animations: no
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_categories: programming
          plugin_languages_details: percentage, lines
          plugin_repositories: yes
          plugin_repositories_pinned: 6
